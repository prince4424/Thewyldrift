version: '3.8'

services:
  backend:
    build: ./backend
    container_name: thewyldrift-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CLIENT_ORIGIN=http://your-domain.com
    env_file:
      - ./backend/.env
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: thewyldrift-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
